{% extends "base.html" %}{% block content %}
<h1>Sign in</h1>
<p>Enter your account details.</p>
{% if message %}
<div class="notice">
    {{ message }}
</div>
{% endif %}
<form method="post">
<label>Username</label>
<input name="username" required>
<label>Password</label>
<input type="password" name="password" required>
<button>Sign in</button>
</form>
{% endblock %}
